 @top-center{content:element(planhead);width:100%;vertical-align:bottom;margin:0 0 3mm}
 @top-right{content:counter(page) "/" counter(pages);font:800 16pt Arial,Helvetica,sans-serif;color:#fff;background:transparent;width:19mm;height:18mm;text-align:center;vertical-align:middle;margin:0 1.5mm 3mm 0}

.main-matrix{table-layout:fixed;width:100%;border:2px solid var(--navy);border-collapse:separate;border-spacing:0;margin:0;background:#fff}
.main-matrix col.piece-col{width:28%}

.main-matrix thead th:nth-child(2),.main-matrix tbody tr>th:nth-child(2){border-right:2px solid var(--navy)}
