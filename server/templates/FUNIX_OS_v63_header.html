<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
/* Cabeçalho de impressão da OS V63: layout aprovado pela direção.
   Não altera a matriz ou legenda. Os placeholders são preenchidos no backend. */
.osv63-header{
  --navy:#0A1F44;
  width:100%;
  height:15mm;
  display:grid;
  grid-template-columns:53mm 43mm minmax(0,1fr) 56mm 26mm;
  align-items:stretch;
  background:var(--navy);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  box-sizing:border-box;
  overflow:hidden;
}
.osv63-header *, .osv63-header *::before, .osv63-header *::after{box-sizing:border-box;}
.osv63-header .brand, .osv63-header .field{
  display:flex;
  height:100%;
  min-width:0;
  align-items:center;
}
.osv63-header .brand{
  justify-content:center;
  gap:2.8mm;
  padding:0 2mm;
  white-space:nowrap;
}
.osv63-header .os-prefix{
  font-family:Arimo,Arial,Helvetica,sans-serif;
  font-size:19pt;
  font-weight:700;
  line-height:1;
  letter-spacing:-.35px;
  flex:none;
}
.osv63-header .brand svg{
  display:block;
  width:32mm;
  height:auto;
  max-height:none;
  flex:0 0 auto;
  transform:translateY(.2mm);
}
.osv63-header .field{
  border-left:2px solid #fff;
  display:grid;
  grid-template-columns:max-content minmax(0,1fr);
  align-content:center;
  align-items:center;
  column-gap:1.6mm;
  padding:0 2.5mm;
  white-space:nowrap;
}
.osv63-header .label{
  color:#fff;
  font:400 10pt/1 Arial,Helvetica,sans-serif;
  text-align:left;
  white-space:nowrap;
}
.osv63-header .value{
  min-width:0;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  font-size:12pt;
  font-weight:900;
  -webkit-text-stroke:0.18px currentColor;
  line-height:1.06;
  letter-spacing:-.15px;
  text-align:center;
  white-space:nowrap;
}
.osv63-header .delivery-field .value{font-size:12pt;}
.osv63-header .page-field{column-gap:1.2mm;padding:0 1.9mm;}
.osv63-header .page-field .value{font-size:12pt;}
/* O rótulo fica à esquerda; o texto do veículo se centraliza na área restante. */
.osv63-header .vehicle-field{column-gap:1.6mm;padding:0 2.6mm;}
.osv63-header .vehicle-field .value{
  justify-self:stretch;
  font-size:12pt;
  white-space:normal;
  overflow-wrap:anywhere;
  line-height:1.04;
  text-wrap:balance;
}
/* Nomes especialmente longos: manter 12 pt e caber em duas linhas. */
.osv63-header .vehicle-field--long .value{letter-spacing:-1px;}
</style>
</head>
<body>
<header class="osv63-header" aria-label="Cabeçalho da Ordem de Serviço FUNIX">
  <div class="brand" aria-label="OS FUNIX">
    <span class="os-prefix">OS</span>
    {{FUNIX_LOGO_SVG}}
  </div>
  <div class="field id-field">
    <span class="label">ID:</span>
    <strong class="value">{{OS_NUMBER}}</strong>
  </div>
  <div class="field vehicle-field">
    <span class="label">VEÍCULO:</span>
    <strong class="value">{{VEHICLE}}</strong>
  </div>
  <div class="field delivery-field">
    <span class="label">ENTREGA:</span>
    <strong class="value">{{DELIVERY}}</strong>
  </div>
  <div class="field page-field">
    <span class="label">PÁG.:</span>
    <strong class="value"><span class="pageNumber"></span>/<span class="totalPages"></span></strong>
  </div>
</header>
</body>
</html>
