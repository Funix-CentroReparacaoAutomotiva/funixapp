# Disposable laboratory only; invoked by run.py with a fresh project and secrets.
services:
  postgres:
    image: postgres@sha256:f6498f214984ab10ad90d839204a19effa2ad3aff15fbacd12e43cd8b527c5e5
    platform: linux/amd64
    environment:
      POSTGRES_USER: lab
      POSTGRES_DB: evolution_lab
      POSTGRES_PASSWORD: ${LAB_PG_PASSWORD:?generated by run.py}
    volumes: [pg_data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lab -d evolution_lab]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 512m
    cpus: 1
  redis:
    image: redis@sha256:b9f6cf0cab55fdd102fd2182deeae150457943d33439d18c6e2fc5666d3228c1
    platform: linux/amd64
    environment:
      LAB_REDIS_PASSWORD: ${LAB_REDIS_PASSWORD:?generated by run.py}
    command: [sh, -ec, 'exec redis-server --appendonly yes --protected-mode yes --requirepass "$$LAB_REDIS_PASSWORD"']
    volumes: [redis_data:/data]
    networks: [private]
    mem_limit: 128m
    cpus: 0.5
  evolution:
    image: evoapicloud/evolution-api@sha256:456b4104b0ddffbb092d6b3c0560a4ae86fc3e014e885b882aca4b1b371dfc81
    platform: linux/amd64
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    environment:
      SERVER_PORT: '8080'
      SERVER_TYPE: http
      SERVER_URL: http://127.0.0.1:8080
      AUTHENTICATION_API_KEY: ${LAB_API_KEY:?generated by run.py}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'false'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://lab:${LAB_PG_PASSWORD:?generated by run.py}@postgres:5432/evolution_lab?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: synthetic_contract_lab
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'true'
      DATABASE_SAVE_MESSAGE_UPDATE: 'true'
      DATABASE_SAVE_DATA_CHATS: 'true'
      DATABASE_SAVE_DATA_CONTACTS: 'true'
      DATABASE_DELETE_MESSAGE: 'false'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://:${LAB_REDIS_PASSWORD:?generated by run.py}@redis:6379/0
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      CACHE_LOCAL_ENABLED: 'false'
      DEL_INSTANCE: 'false'
      TELEMETRY_ENABLED: 'false'
      TELEMETRY_URL: ''
      SENTRY_DSN: ''
      WEBHOOK_GLOBAL_ENABLED: 'false'
      WEBHOOK_EVENTS_ERRORS: 'false'
      RABBITMQ_ENABLED: 'false'
      SQS_ENABLED: 'false'
      NATS_ENABLED: 'false'
      KAFKA_ENABLED: 'false'
      WEBSOCKET_ENABLED: 'false'
      PUSHER_ENABLED: 'false'
      CHATWOOT_ENABLED: 'false'
      TYPEBOT_ENABLED: 'false'
      OPENAI_ENABLED: 'false'
      DIFY_ENABLED: 'false'
      N8N_ENABLED: 'false'
      EVOAI_ENABLED: 'false'
      S3_ENABLED: 'false'
      LOG_LEVEL: ERROR
      LOG_BAILEYS: silent
      # Runtime has no egress. Do not inject the host's dependency-download proxy.
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      ALL_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      NO_PROXY: '*'
    volumes:
      - instances:/evolution/instances
      - ./:/lab:ro
      - ../../server/experimental/evolution-read/client.ts:/poc/client.ts:ro
      - ${LAB_OUTPUT_DIR:?generated by run.py}:/results
    networks: [private]
    mem_limit: 1536m
    cpus: 1
    security_opt: [no-new-privileges:true]
networks:
  private:
    internal: true
volumes:
  pg_data: {}
  redis_data: {}
  instances: {}
