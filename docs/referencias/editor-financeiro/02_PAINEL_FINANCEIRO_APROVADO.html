<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FUNIX — Painel financeiro aprovado</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#17191e;background:#fff}
*{box-sizing:border-box}body{margin:0;padding:12px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}svg.icon{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex:none}
.caption{max-width:560px;margin:12px auto;color:#68727e;font-size:12px;line-height:1.5}.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}


.finance{--navy:#172f55;--field:#213f69;--border:#354e72;--muted:#c2d3ee;max-width:560px;width:100%;margin:4px auto 0;background:var(--navy);color:#fff;border-radius:12px;overflow:hidden;font-size:13px;line-height:1.45}
.finance button,.finance select,.finance input{font:inherit}
.finance .summary{background:transparent;color:inherit;border:0;width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 12px;gap:4px;align-items:center;text-align:left;padding:13px 12px 12px}
.finance .metric{min-width:0}.finance .metric small{display:block;color:#c6d7f0;font-size:10px;white-space:nowrap;margin-bottom:4px}.finance .metric span{display:block;font-size:11px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}.finance .metric.final{text-align:right}.finance .metric.final span{font-weight:800}
.finance .summary .icon{width:13px;height:13px;stroke-width:2;color:#b3c8e5}
.finance .body{border-top:1px solid var(--border);padding:13px 13px 25px;display:flex;flex-direction:column;gap:13px}
.finance .factors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:1px}
.finance .factor{min-width:0}.finance .factor label{display:block;text-align:center;color:#d2def3;font-size:12px;margin-bottom:6px}
.finance .select-wrap{position:relative;min-width:0}
.finance .select-wrap select{appearance:none;-webkit-appearance:none;display:block;width:100%;min-width:0;background:var(--field);border:1px solid #607b9e;border-radius:999px;color:#fff;font-size:13px;font-weight:650;text-align:center;text-align-last:center;padding:0 22px 0 6px;height:37px;outline-offset:2px;cursor:pointer;color-scheme:dark}
.finance .select-wrap .icon{position:absolute;right:9px;top:10px;width:15px;height:15px;pointer-events:none;color:#b7c8e0}
.finance .select-wrap option{background:#213f69;color:#fff}
.finance .rule{width:100%;height:1px;background:var(--border);flex:none}
.finance .line{display:flex;justify-content:space-between;align-items:center;min-height:21px;gap:10px}
.finance .line span:first-child{color:var(--muted)}.finance .line .number{font-variant-numeric:tabular-nums;color:#fff;font-weight:650;white-space:nowrap}
.finance .neg-head{display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px;background:none;border:0;color:#fff;padding:0;text-align:left;min-height:21px;font-size:13px;font-weight:400}
.finance .neg-head .neg-label{color:var(--muted)}.finance .neg-head .neg-value{color:#fff;font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.finance .neg-arrow{display:inline-block;font-size:14px;color:#ccdaef;width:11px}
.finance .neg-fields{display:flex;align-items:center;gap:9px;margin:1px 0 0}.finance .segments{display:flex;flex:1;min-width:0;border:1px solid #607b9e;border-radius:999px;padding:3px;gap:2px;overflow:hidden}
.finance .segments button{flex:1;background:transparent;border:0;border-radius:999px;color:#fff;padding:7px 4px;font-weight:500;font-size:12px;min-width:0;white-space:nowrap}.finance .segments button.active{background:var(--field);font-weight:750;color:#fff}
.finance .money{width:132px;min-width:0;flex:none;background:var(--field);border:1px solid #607b9e;border-radius:999px;height:39px;color:#fff;text-align:right;padding:0 14px;outline-offset:2px;font-variant-numeric:tabular-nums}
.finance .money::placeholder{color:#c2d3ee}.finance .total{display:flex;justify-content:space-between;align-items:center;gap:10px}.finance .total strong{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.finance .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.finance .actions button{height:39px;border-radius:8px;font-weight:700;font-size:12px;padding:4px 8px}
.finance .preview{background:transparent;border:1px solid #cad8ef;color:#fff}.finance .emit{background:#fff;color:#142b60;border:1px solid #fff}
.finance .notice{font-size:11px;color:#c2d3ee}.finance .error{font-size:11px;color:#f4d4a4}
.finance [hidden],.editor [hidden]{display:none!important}
@media(max-width:400px){.finance .summary{padding:12px 9px;gap:2px;grid-template-columns:repeat(4,minmax(0,1fr)) 10px}.finance .metric small{font-size:9px}.finance .metric span{font-size:10px}.finance .body{padding:12px 10px 17px;gap:11px}.finance .factors{gap:6px}.finance .select-wrap select{font-size:12px;padding-right:16px;padding-left:3px}.finance .select-wrap .icon{right:5px}.finance .money{width:116px;font-size:12px;padding-right:9px}.finance .segments button{font-size:11px}}
</style></head><body><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3.5 17.5a2.1 2.1 0 0 0 3 3l4.8-4.8a5 5 0 0 0 6.4-6.4l-3 3-3-3 3-3Z"/></symbol>
<symbol id="i-cube" viewBox="0 0 24 24"><path d="m12 2 8 4.5v11L12 22 4 17.5v-11L12 2Z"/><path d="m4 6.5 8 4.5 8-4.5M12 11v11"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
<symbol id="i-note" viewBox="0 0 24 24"><path d="M19 14V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h9Z"/><path d="M15 19v-5h5"/></symbol>
<symbol id="i-cloud" viewBox="0 0 24 24"><path d="M20 16.5a4.5 4.5 0 0 0-4.2-4.5A6 6 0 0 0 4 14.2 3.5 3.5 0 0 0 6.5 20H19a3.5 3.5 0 0 0 1-3.5Z"/></symbol>
<symbol id="i-switch-on" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="6"/><circle cx="16" cy="12" r="3"/></symbol>
<symbol id="i-switch-off" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="6"/><circle cx="8" cy="12" r="3"/></symbol>
</svg><main class="finance" aria-label="Painel financeiro — referência visual FUNIX">
<button type="button" class="summary" id="panelToggle" aria-expanded="true"><div class="metric"><small>Serviços</small><span>R$ 2.500,00</span></div><div class="metric"><small>Componentes</small><span>R$ 450,00</span></div><div class="metric"><small id="headAdjustLabel">Desconto</small><span id="headAdjust">− R$ 250,00</span></div><div class="metric final"><small>Total final</small><span id="headTotal">R$ 2.700,00</span></div><svg class="icon" id="panelArrow"><use href="#i-chevron"/></svg></button>
<div class="body" id="panelBody">
<div class="factors"><div class="factor"><label for="tabela">Tabela</label><div class="select-wrap"><select id="tabela"><option value="A">A</option><option value="B">B</option></select><svg class="icon"><use href="#i-chevron"/></svg></div></div>
<div class="factor"><label for="fc">FC</label><div class="select-wrap"><select id="fc"><option value="1.00">1,00</option><option value="1.15">1,15</option></select><svg class="icon"><use href="#i-chevron"/></svg></div></div>
<div class="factor"><label for="fr">FR</label><div class="select-wrap"><select id="fr"><option value="1.00">1,00</option><option value="1.10">1,10</option></select><svg class="icon"><use href="#i-chevron"/></svg></div></div>
<div class="factor"><label for="mr">MR</label><div class="select-wrap"><select id="mr"><option value="1.20">1,20</option><option value="1.00">1,00</option><option value="1.30">1,30</option></select><svg class="icon"><use href="#i-chevron"/></svg></div></div></div>
<div class="rule"></div>
<div class="line"><span>Serviços originais</span><span class="number">R$ 2.500,00</span></div>
<button type="button" class="neg-head" id="negToggle" aria-expanded="false"><span class="neg-label"><span class="neg-arrow" id="negArrow">›</span>Negociação comercial</span><span class="neg-value" id="negSummary">− R$ 250,00</span></button>
<div id="negBody" hidden><div class="neg-fields"><div class="segments" role="group" aria-label="Tipo de negociação"><button id="discountButton" type="button" class="active" aria-pressed="true">Desconto</button><button id="negotiationButton" type="button" aria-pressed="false">Negociação</button></div><input id="discountValue" class="money" type="text" inputmode="numeric" aria-label="Valor em reais" value="R$ 250,00"></div><div id="negError" class="error" hidden></div></div>
<div class="line"><span>Serviço</span><span id="serviceAfter" class="number">R$ 2.250,00</span></div>
<div class="line"><span>Componente</span><span class="number">R$ 450,00</span></div>
<div class="rule"></div><div class="total"><span>Total final</span><strong id="finalTotal">R$ 2.700,00</strong></div>
<div class="actions"><button class="preview" id="preview" type="button">Conferir prévia</button><button class="emit" id="emit" type="button">Emitir orçamento</button></div>
<div class="notice" id="notice" role="status" hidden></div>
</div></main><div class="caption">Referência visual e de interação. Valores fictícios; a prévia não emite orçamentos nem consulta o backend. O cálculo comercial real pertence ao aplicativo.</div><script>
(()=>{const root=document.querySelector('.finance');if(!root)return;const $=sel=>root.querySelector(sel);
const currency=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Math.abs(n));
const signed=n=>(n<0?'− ':n>0?'+ ':'')+currency(n);
let mode='discount',cents=25000,mainOpen=true,negOpen=false;
function render(){let entered=cents/100,adj=cents===0?0:(mode==='discount'?-entered:entered-2950);const valid=cents===0||(mode==='discount'?entered<=2500:entered>=450);
const factorsChanged=$('#tabela').value!=='A'||$('#fc').value!=='1.00'||$('#fr').value!=='1.00'||$('#mr').value!=='1.20';
const okay=valid&&!factorsChanged;
$('#discountValue').value=currency(entered);$('#headAdjustLabel').textContent=adj>0?'Acréscimo':'Desconto';$('#headAdjust').textContent=okay?signed(adj):'—';$('#negSummary').textContent=okay?signed(adj):'—';$('#serviceAfter').textContent=okay?currency(2500+adj):'—';$('#headTotal').textContent=okay?currency(2950+adj):'—';$('#finalTotal').textContent=okay?currency(2950+adj):'—';
$('#negError').hidden=valid;$('#negError').textContent=mode==='discount'?'Desconto maior que serviços.':'O total negociado deve cobrir os componentes.';
$('#preview').disabled=!okay;$('#emit').disabled=!okay;
if(factorsChanged){$('#notice').hidden=false;$('#notice').textContent='Fatores modificados: o recálculo real depende do backend.'}else if($('#notice').textContent.includes('Fatores modificados')){$('#notice').hidden=true;$('#notice').textContent=''}
}
$('#panelToggle').addEventListener('click',()=>{mainOpen=!mainOpen;$('#panelBody').hidden=!mainOpen;$('#panelToggle').setAttribute('aria-expanded',String(mainOpen));$('#panelArrow').style.transform=mainOpen?'':'rotate(180deg)'});
$('#negToggle').addEventListener('click',()=>{negOpen=!negOpen;$('#negBody').hidden=!negOpen;$('#negArrow').textContent=negOpen?'⌄':'›';$('#negToggle').setAttribute('aria-expanded',String(negOpen))});
function select(next){mode=next;cents=0;for(let [id,kind] of [['#discountButton','discount'],['#negotiationButton','negotiation']]){const active=mode===kind;$(id).classList.toggle('active',active);$(id).setAttribute('aria-pressed',String(active))}render()}
$('#discountButton').addEventListener('click',()=>select('discount'));$('#negotiationButton').addEventListener('click',()=>select('negotiation'));
$('#discountValue').addEventListener('input',e=>{cents=Number(e.target.value.replace(/\D/g,'').slice(0,11))||0;render()});
root.querySelectorAll('.factors select').forEach(s=>s.addEventListener('change',render));
$('#preview').addEventListener('click',()=>{$('#notice').hidden=false;$('#notice').textContent='Prévia simulada; nenhum orçamento foi emitido.'});
$('#emit').addEventListener('click',()=>{$('#notice').hidden=false;$('#notice').textContent='Emissão simulada; nenhum orçamento foi criado.'});render();
})();
</script></body></html>
