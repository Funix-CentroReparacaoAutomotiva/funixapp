<!-- 
 FUNIX V11 UI/UX decision register, 2026-10-19.
 N. One compact top row: Entity / active Atendimento & its Veículo / Orçamentos / simulated unread trigger.
 O. Entidade 1:N Atendimentos, Entidade 1:N Veículos; each Atendimento refers to one Veículo. The user's latest 1:1 Entidade–Veículo remark conflicts with their multi-vehicle examples; preserve explicit multi-vehicle behavior pending confirmation.
 P. Diagnósticos+Mapa = live ATTENDANCE work, not an immutable quote; keep synced and independent per atendimento.
 Q. Criar orçamento creates immutable snapshot of enabled parts, service details, commercial terms, and demonstrative total. Original quote never edited, only status changes (approval/cancellation).
 R. Quote previews are on-demand HTML, never saved PDF. Accessible in compact top count and Chat rail. Modal closes back to current screen/draft.
 S. Monetary indicators are simple sums, including possible duplicate alternatives by explicit user direction. No anti-double-counting implemented. Financial responsibility handled by ERP, not this commercial mockup.
 T. The user wants no extra Quote tab or permanent quote selection layer. Draft does not reset after creating a quote.

 J. Correct V9 initialization bug: render Chat messages and three quick templates on first load.
 K. Remove redundant Orçar action on Chat rail; "Mapa" shortcut is still the quick-message map.
 L. Change primary page order to Chat / Diagnósticos / Mapa, with swipe and tab selections synchronized.
 M. Multi-Atendimento and multi-Orçamento context is intentionally NOT invented in this patch. The product model remains under discovery.
 A. Integrate Chat / Mapa / Diagnósticos with synced tabs and swipe.
 B. Unread Chat badge shows incoming messages not yet seen in Chat. Entry into Chat marks read.
 C. Region menu and nested part-family taxonomy follow the Codex export:
    src/car-region-menu.ts, shared/component-map.ts, shared/touch-model.ts;
    src/CarRegionSelector.tsx; catalog/03_COMPONENTES_PARTES.json.
 D. Group state: none=empty outline, some=stroke indicator + intermediate fill, all=check + strong fill.
 E. Map and diagnoses footer identical: Concluir orçamento + Total.
 F. Diagnoses UI restores concepts and interaction semantics from src/Mockup.tsx,
    src/mockup.css, src/vehicle-map.css, 04_DIAGNOSTICOS_SERVICOS.json,
    05_DIMENSOES_SERVICOS.json: per-item editor, diagnosis/intensity, service size,
    quantity, amount, components, commercial adjustment.
 G. Values are invented prototype figures, NOT ERP pricing or audited commercial output.
 H. Never wire backend or send messages when this HTML runs.
 I. Historic catalogs are partial UI references (not a live synchronized database).
 -->
<script>

const $=id=>document.getElementById(id);
const icon={photos:'<svg viewBox="0 0 24 24"><path d="M4 7h4l2-2h4l2 2h4v11H4z"/><circle cx="12" cy="13" r="3"/></svg>',quote:'<svg viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6zM15 3v6h5M9 13h7M9 17h7"/></svg>',hello:'<svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h9M5 17h11"/></svg>',visit:'<svg viewBox="0 0 24 24"><path d="M12 21s6-5.1 6-11a6 6 0 10-12 0c0 5.9 6 11 6 11z"/><circle cx="12" cy="10" r="2"/></svg>',later:'<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 11-8-8M12 7v5l3 2"/></svg>',follow:'<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg>',pen:'<svg viewBox="0 0 24 24"><path d="M4 20h5L20 9l-5-5L4 15zM13 6l5 5"/></svg>',part:'<svg viewBox="0 0 24 24"><path d="M4 8l8-5 8 5v9l-8 4-8-4zM4 8l8 5 8-5M12 13v8"/></svg>'};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const seed={messages:[{who:'in',text:'Bom dia! Bateram no carro do meu filho e pegou o para-choque traseiro. Queria saber se normalmente precisa trocar ou se dá para recuperar.',time:'09:11'},{who:'out',text:'Bom dia, Márcia! Em muitos casos dá para recuperar, mas depende do dano e dos encaixes. Se puder me mandar algumas fotos, consigo te orientar melhor.',time:'09:14'},{who:'in',kind:'photo',text:'Foto do dano enviada',time:'09:18'},{who:'in',text:'Mandei a foto. Fiquei na dúvida porque parece que abriu um pouco do lado.',time:'09:19'}],
 ideas:['Rafael, pela foto ainda não dá para confirmar se precisa substituir. Em muitos casos conseguimos recuperar, mas preciso conferir melhor os encaixes laterais. Pode me mandar uma foto mais afastada e outra mostrando a lateral do para-choque?','Rafael, pode ser possível recuperar sem trocar a peça. Como parece ter aberto perto do encaixe, preciso de outra foto lateral para te orientar com mais segurança.','Rafael, vamos avaliar direitinho antes de pensar em substituição. Me manda uma foto do encaixe e uma mais afastada para eu entender o dano completo?'],ideaIndex:0,custom:'',simCount:0,compose:'',counts:{photos:9,quote:7,hello:5,visit:3,later:2,follow:1},ai:[{who:'ai',text:'Estou acompanhando o atendimento. A próxima ação sugerida é pedir fotos do encaixe lateral.'}],
 parts:[{id:'bumper',region:'Traseira',name:'Para-choque traseiro',diag:'A confirmar',note:'Abertura lateral informada pelo cliente. Avaliar encaixes e extensão do dano.',services:['Recuperação de para-choque','Pintura de para-choque'],components:[]},{id:'guide',region:'Traseira',name:'Suporte/guia traseiro',diag:'A verificar',note:'Conferir integridade do suporte antes de incluir substituição.',services:[],components:[]}],page:0,filter:'todos'};
let state;try{const saved=JSON.parse(localStorage.getItem('funix-v14-integrado')||'{}');state={...structuredClone(seed),...saved};if(!Array.isArray(state.parts)||!Array.isArray(state.messages))throw Error();}catch{state=structuredClone(seed)}
try{if(!localStorage.getItem('funix-v11-demo')&&!localStorage.getItem('funix-v10-demo')&&(state.page===1||state.page===2))state.page=3-state.page;}catch{};
state.counts={...seed.counts,...(state.counts||{})};
const persist=()=>{state.compose=$('message').value;
  if(Array.isArray(state.attendances)){const a=state.attendances.find(a=>a.id===state.activeAttendanceId);if(a){a.parts=structuredClone(state.parts);a.commercial=structuredClone(state.commercial);}}
  try{localStorage.setItem('funix-v14-integrado',JSON.stringify(state))}catch{}};
let toastHandle;function toast(s){const t=$('toast');t.textContent=s;t.classList.add('visible');clearTimeout(toastHandle);toastHandle=setTimeout(()=>t.classList.remove('visible'),2450)}
// V10 UX: Chat → Diagnósticos → Mapa. DOM and navigation arrays share the same order.
$('tab-map').before($('tab-items'));
$('page-map').before($('page-items'));
let page=Math.max(0,Math.min(2,state.page||0));const tabs=[$('tab-chat'),$('tab-items'),$('tab-map')];const panes=[$('page-chat'),$('page-items'),$('page-map')];
function setPage(i,keep=false){page=Math.max(0,Math.min(2,i));$('track').style.transform=`translate3d(${-page*100}%,0,0)`;tabs.forEach((b,n)=>{b.classList.toggle('active',n===page);b.setAttribute('aria-selected',String(n===page));b.tabIndex=n===page?0:-1;panes[n].inert=n!==page;});if(!keep){state.page=page;persist()}closePop();hideDisc();}
tabs.forEach((b,i)=>b.addEventListener('click',()=>setPage(i)));
$('go-items').onclick=()=>setPage(1);$('back-map').onclick=()=>setPage(2);$('back-chat').onclick=()=>setPage(0);$('back').onclick=()=>toast('Protótipo: esta é a tela do atendimento.');
// Natural carousel interaction: swipe left advances and right returns. Vertical scrolling stays native.
let swipe=null;const pager=$('pager');pager.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if($('modal-shade').classList.contains('open')||$('disc-backdrop').classList.contains('visible')||e.target.closest('input,textarea,select,.pop,.rail,.compose,.disc-backdrop,.modal-shade,[contenteditable="true"]'))return;swipe={x:e.clientX,y:e.clientY,moved:false,active:false,original:page};},{passive:true});
pager.addEventListener('pointermove',e=>{if(!swipe)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.45){swipe.active=true;const bounded=Math.max(-pager.clientWidth*.48,Math.min(pager.clientWidth*.48,dx));$('track').style.transition='none';$('track').style.transform=`translate3d(calc(${-page*100}% + ${bounded}px),0,0)`;tabs.forEach((b,n)=>b.classList.toggle('active',n===Math.max(0,Math.min(2,page+(dx<-55?1:dx>55?-1:0)))));}},{passive:true});
function endSwipe(e){if(!swipe)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;const active=swipe.active;swipe=null;$('track').style.transition='';if(active&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.12){setPage(page+(dx<0?1:-1))}else setPage(page,true)}
pager.addEventListener('pointerup',endSwipe);pager.addEventListener('pointercancel',()=>{swipe=null;$('track').style.transition='';setPage(page,true)});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){hideDisc();closePop();closeSheet();return}if(e.target.closest('input,textarea,select'))return;if(e.key==='ArrowRight')setPage(page+1);if(e.key==='ArrowLeft')setPage(page-1)});

// Chat V7: quick actions on rail, small balloons, human controls the outgoing message.
const templates=[{id:'hello',label:'Olá',icon:'hello',group:'Abertura',message:'Oi, Rafael! Tudo bem? Obrigado por entrar em contato com a FUNIX. Como posso te ajudar com o veículo?'},{id:'photos',label:'Fotos',icon:'photos',group:'Abertura',message:'Rafael, consegue me enviar uma foto mais afastada do para-choque e outra mostrando o encaixe lateral? Assim consigo avaliar melhor a possibilidade de recuperação.'},{id:'quote',label:'Orçamento',icon:'quote',group:'Proposta',message:'Rafael, segue seu orçamento para avaliação. Se tiver alguma dúvida sobre os serviços ou quiser entender melhor o que está incluído, estou à disposição.'},{id:'visit',label:'Avaliação',icon:'visit',group:'Proposta',message:'Rafael, para confirmar a melhor solução, o ideal é avaliarmos o veículo pessoalmente. Se puder trazer o carro, conseguimos verificar os encaixes com mais segurança.'},{id:'later',label:'Depois',icon:'later',group:'Retomada',message:'Tudo bem, Rafael! Sem problema. Quando quiser retomar a conversa, pode me chamar por aqui. Continuarei à disposição.'},{id:'follow',label:'Retomar',icon:'follow',group:'Retomada',message:'Oi, Rafael! Passando para saber se ficou alguma dúvida sobre o orçamento. Caso queira continuar, estou à disposição para te orientar.'}];
function drawMessages(){let html='<span class="day">HOJE</span>';for(const m of state.messages){if(m.kind==='system'){html+=`<div class="system-event">${esc(m.text)}</div>`;continue}let body=m.kind==='photo'?`<div class="photo-fake">${icon.photos}<div>Foto recebida<small>Imagem fictícia de teste</small></div></div>`:m.kind==='audio'?'<div class="audio-fake"><span class="audio-play">▶</span><span class="wave">▁▂▃▅▆▃▄▂</span><span>0:18</span></div>':esc(m.text);html+=`<div class="message ${m.who==='out'?'mine':''}"><span class="face">${m.who==='out'?'F':esc((v14CurrentChat()?.name||'C').split(/\s+/).map(x=>x[0]).filter(Boolean).slice(0,2).join('').toUpperCase())}</span><div class="bubble">${body}<small>${esc(m.time)}${m.who==='out'?' ✓✓':''}</small></div></div>`;}const el=$('thread');el.innerHTML=html;requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight})}
function favs(){return [...templates].sort((a,b)=>(state.counts[b.id]||0)-(state.counts[a.id]||0)).slice(0,3)}
function renderFavs(){favs().forEach((t,i)=>{const btn=$('r-fav-'+i);btn.innerHTML=`${icon[t.icon]}<span>${esc(t.label)}</span>`;btn.dataset.template=t.id;btn.title=t.message})}
function putMessage(text){const field=$('message');field.value=field.value.trim()?field.value.trim()+'\n'+text:text;field.dispatchEvent(new Event('input'));setPage(0);field.focus();toast('Texto inserido. Revise antes de enviar.');}
function useTemplate(id){const t=templates.find(x=>x.id===id);if(!t)return;state.counts[id]=(state.counts[id]||0)+1;renderFavs();putMessage(t.message);persist()}
let popupMode='',popupButton=null,voice=false;
function closePop(){const pop=$('pop');pop.className='pop';popupMode='';popupButton=null;document.querySelectorAll('.rail-btn').forEach(e=>e.classList.remove('active'))}
function showPop(button,mode,force=false){if(!force&&popupMode===mode&&popupButton===button){closePop();return;}popupMode=mode;popupButton=button;document.querySelectorAll('.rail-btn').forEach(e=>e.classList.toggle('active',e===button));const pop=$('pop');pop.className='pop open'+(mode==='suggest'?' sugg':mode==='map'?' map-pop':'');if(mode==='suggest'){pop.innerHTML=`<div class="pop-quote">${esc(state.custom||state.ideas[state.ideaIndex%state.ideas.length])}</div><div class="pop-buttons"><button class="apply" id="p-apply">↓ Para mensagem</button><button class="again" id="p-next">↻ Outra</button></div>`}else if(mode==='map'){pop.innerHTML=`<div class="pop-head">Mapa de mensagens</div><div class="map-caption">Selecione um texto pronto para preencher a mensagem. Não será enviado.</div><div class="map-tree">${['Abertura','Proposta','Retomada'].map(g=>`<div class="map-group"><div class="map-branch">${g}</div>${templates.filter(t=>t.group===g).map(t=>`<button class="map-node" data-template="${t.id}"><strong>${icon[t.icon]} ${esc(t.label)}</strong><small>${esc(t.message.length>91?t.message.slice(0,88)+'…':t.message)}</small></button>`).join('')}</div>`).join('')}</div>`}else if(mode==='ai'){pop.innerHTML=`<div class="pop-head">✦ Conversa com o Copiloto</div><div class="ai-messages">${state.ai.slice(-7).map(m=>`<div class="ai-msg ${m.who==='me'?'me':''}">${esc(m.text)}</div>`).join('')}</div>${voice?'<div class="voice-indicator"><span class="voice-pulse"></span>Áudio ativado · simulação<button id="voice-finish">Concluir áudio de teste</button></div>':''}<div class="ai-input"><textarea id="ai-text" rows="2" placeholder="Oriente a IA..."></textarea><button id="ai-voice" title="Áudio">🎙</button><button id="ai-send" title="Enviar para IA">➤</button></div>`}
const area=$('stage').getBoundingClientRect(),rect=button.getBoundingClientRect();const desired=rect.top-area.top-6;const max=area.height-pop.offsetHeight-12;pop.style.top=Math.max(8,Math.min(desired,max))+'px';if(mode==='ai')pop.querySelector('.ai-messages').scrollTop=1e5;
}
function aiAsk(s){if(!s.trim())return;state.ai.push({who:'me',text:s.trim()});state.ai.push({who:'ai',text:'Entendi sua orientação. Posso organizar os próximos passos e preparar uma mensagem, mas o diagnóstico e a decisão continuam com você. (Resposta simulada.)'});voice=false;persist();showPop($('r-chat'),'ai',true)}
$('r-suggestion').onclick=()=>showPop($('r-suggestion'),'suggest');$('r-chat').onclick=()=>{voice=false;showPop($('r-chat'),'ai')};$('r-voice').onclick=()=>{voice=true;showPop($('r-voice'),'ai',true)};$('r-map').onclick=()=>showPop($('r-map'),'map');
for(let i=0;i<3;i++)$('r-fav-'+i).onclick=e=>useTemplate(e.currentTarget.dataset.template);

  const original=list.innerHTML;list.innerHTML=original;
})();

</style><script id="fx-v20-script">(function(){
const $=id=>document.getElementById(id),body=document.body;
const data=[
{id:'AT-1042',name:'Marcos Silva',car:'Onix',plate:'ABC1D23',detail:'Para-choque traseiro',stage:'Novo atendimento',msg:'Vou enviar as fotos agora',time:'09:42',unread:2,kind:'funil'},
{id:'AT-1041',name:'Fernanda Costa',car:'HB20',plate:'QWE4F56',detail:'Porta dianteira',stage:'Orçamento',msg:'Pode confirmar o orçamento?',time:'09:15',unread:1,kind:'funil'},
{id:'AT-1040',name:'Ricardo Alves',car:'Renegade',plate:'RTY7G89',detail:'Lateral esquerda',stage:'Aguardando cliente',msg:'Obrigado, aguardo retorno.',time:'Ontem',unread:0,kind:'funil'},
{id:'XP-231',name:'Juliana Pereira',car:'Argo',plate:'JKL2H34',detail:'Pintura do capô',stage:'Funilaria',msg:'Como está o serviço?',time:'Ontem',unread:0,kind:'ativo'},
{id:'XP-230',name:'André Santos',car:'Gol',plate:'MNO5J67',detail:'Para-choque dianteiro',stage:'Pintura',msg:'Obrigado!',time:'Segunda',unread:0,kind:'ativo'},
{id:'XP-229',name:'Camila Rocha',car:'Onix',plate:'XPTO123',detail:'Reparo lateral',stage:'Saiu',msg:'Tudo certo, obrigada!',time:'14/09',unread:0,kind:'historico'},
{id:'XP-228',name:'Pedro Lima',car:'Sandero',plate:'PQR8K90',detail:'Porta traseira',stage:'Saiu',msg:'Até a próxima!',time:'05/09',unread:0,kind:'historico'}];
let tab='conversas',scope='ativos',layout='quadro',collapsed=new Set(),returnState=null;
const stages={funil:['Novo atendimento','Triagem','Orçamento','Aguardando cliente','Negociação','Agendado'],ativo:['Agendado','Inspeção entrada','Funilaria','Preparação','Pintura','Montagem','Finalizado']};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pill=v=>'<span class="fh-pill '+(v==='Aguardando cliente'?'orange':'blue')+'">'+esc(v)+'</span>';
const row=d=>'<div class="fh-row" data-fh-id="'+d.id+'"><div class="fh-avatar">'+esc(d.name[0])+'</div><div class="fh-rowmain"><div class="fh-rowhead"><strong>'+esc(d.name)+'</strong><time>'+esc(d.time)+'</time></div><p>'+esc(d.msg)+' · '+esc(d.car)+' · '+esc(d.plate)+'</p></div>'+pill(d.stage)+(d.unread?'<span class="fh-count">'+d.unread+'</span>':'')+'</div>';
const card=d=>'<div class="fh-card" draggable="true" data-fh-id="'+d.id+'"><strong>'+esc(d.name)+'</strong><p>'+esc(d.car)+' · '+esc(d.plate)+'<br>'+esc(d.detail)+'</p><div class="fh-cardfoot"><span style="font-size:10px;color:#8392a8">'+esc(d.id)+'</span><span style="font-size:11px;color:#234e97;font-weight:800">Abrir ↗</span></div></div>';
function render(){
 document.querySelectorAll('[data-fh-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.fhTab===tab));
 $('fh-filters').innerHTML=(tab==='veiculos'?'<button class="fh-filter '+(scope==='ativos'?'active':'')+'" data-fh-scope="ativos">Em acompanhamento</button><button class="fh-filter '+(scope==='historico'?'active':'')+'" data-fh-scope="historico">Histórico</button>':'')+((tab==='funil'||tab==='veiculos'&&scope==='ativos')?'<div class="fh-listtoggle"><button data-fh-layout="quadro" class="'+(layout==='quadro'?'active':'')+'">▥ Quadro</button><button data-fh-layout="lista" class="'+(layout==='lista'?'active':'')+'">☷ Lista</button></div>':'');
 const q=$('fh-search').value.trim().toLowerCase();
 const rows=data.filter(d=>(tab==='conversas'||tab==='funil'&&d.kind==='funil'||tab==='veiculos'&&d.kind===(scope==='ativos'?'ativo':'historico'))&&[d.name,d.car,d.plate,d.id,d.stage,d.detail,d.msg].join(' ').toLowerCase().includes(q));
 let html='';
 if(tab==='conversas'||tab==='veiculos'&&scope==='historico'||layout==='lista')html='<div class="fh-surface fh-board-list">'+(rows.map(row).join('')||'<div class="fh-empty">Nenhum registro encontrado.</div>')+'</div>';
 else html='<div class="fh-kboard">'+stages[tab==='funil'?'funil':'ativo'].map(stage=>{const rs=rows.filter(d=>d.stage===stage),closed=collapsed.has(tab+stage);return '<div class="fh-lane '+(closed?'collapsed':'')+'" data-fh-lane="'+esc(stage)+'"><div class="fh-lanehead" data-fh-collapse="'+esc(stage)+'" title="'+(closed?'Expandir':'Recolher')+' coluna"><span class="fh-toggle">'+(closed?'▸':'▾')+'</span><span class="fh-lane-title">'+esc(stage)+'</span><em>'+rs.length+'</em></div><div class="fh-lane-items">'+rs.map(card).join('')+'</div></div>'}).join('')+'</div>';
 $('fh-view').innerHTML=html;
}
function goHome(){body.classList.add('fx-home-mode');render();if(returnState){$('fx-home').scrollTop=returnState.scroll;returnState=null}}
function open(d){returnState={tab,scope,scroll:$('fx-home').scrollTop};body.classList.remove('fx-home-mode');/* Retain the original V18 contact context; example records are not synced to the ERP. */}
$('fh-back-detail').addEventListener('click',goHome);
$('fh-search-focus')?.addEventListener('click',()=>$('fh-search').focus());
$('fh-new')?.addEventListener('click',()=>open({id:'novo'}));
$('fh-search').addEventListener('input',render);
$('fx-home').addEventListener('click',e=>{
 const t=e.target.closest('[data-fh-tab]');if(t){tab=t.dataset.fhTab;$('fh-search').value='';render();return}
 const f=e.target.closest('[data-fh-scope]');if(f){scope=f.dataset.fhScope;render();return}
 const l=e.target.closest('[data-fh-layout]');if(l){layout=l.dataset.fhLayout;render();return}
 const c=e.target.closest('[data-fh-collapse]');if(c){const key=tab+c.dataset.fhCollapse;collapsed.has(key)?collapsed.delete(key):collapsed.add(key);render();return}
 const x=e.target.closest('[data-fh-id]');if(x){const d=data.find(a=>a.id===x.dataset.fhId);if(d)open(d)}
});
let dragged=null;
$('fx-home').addEventListener('dragstart',e=>{const card=e.target.closest('.fh-card[draggable]');if(card){dragged=card.dataset.fhId;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragged)}});
$('fx-home').addEventListener('dragover',e=>{const lane=e.target.closest('[data-fh-lane]');if(lane&&dragged){e.preventDefault();e.dataTransfer.dropEffect='move';lane.style.outline='2px dashed #5279bd'}});
$('fx-home').addEventListener('dragleave',e=>{const lane=e.target.closest('[data-fh-lane]');if(lane)lane.style.outline=''});
$('fx-home').addEventListener('drop',e=>{const lane=e.target.closest('[data-fh-lane]');if(lane&&dragged){e.preventDefault();const d=data.find(a=>a.id===dragged);if(d)d.stage=lane.dataset.fhLane;dragged=null;render()}});
$('fx-home').addEventListener('dragend',()=>{dragged=null;document.querySelectorAll('.fh-lane').forEach(x=>x.style.outline='')});
window.funixHome={home:goHome,openById:id=>{const d=data.find(x=>x.id===id);if(d)open(d);return !!d},search:(term,area)=>{tab=area||'veiculos';scope='historico';$('fh-search').value=term;goHome();render()}};
body.classList.add('fx-home-mode');render();
})();</script></body></html>
