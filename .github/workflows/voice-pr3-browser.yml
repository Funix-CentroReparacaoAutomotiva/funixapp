name: PR3 Chromium voice UX
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: node scripts/voice-browser-review.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr3-voice-browser-review
          path: artifacts/voice-review/
          if-no-files-found: ignore
