name: FUNIX - Autorizar candidato HML

on:
  workflow_dispatch:
    inputs:
      request:
        description: JSON com candidate e installed_revision
        type: string
        required: true

permissions: {}

jobs:
  authorize:
    # HML opera com um titular GitHub. Nao fingir revisao independente.
    # Somente despacho manual do titular na main pode acessar o signer.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Funix-CentroReparacaoAutomotiva/funixapp' &&
      github.actor == 'Funix-CentroReparacaoAutomotiva' &&
      github.triggering_actor == 'Funix-CentroReparacaoAutomotiva'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: homologation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Conferir identidade do operador
        env:
          EXPECTED_OPERATOR: Funix-CentroReparacaoAutomotiva
          EFFECTIVE_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$EFFECTIVE_ACTOR" = "$EXPECTED_OPERATOR"
          test "$TRIGGERING_ACTOR" = "$EXPECTED_OPERATOR"
      - name: Emitir autorização com validade de vinte minutos
        env:
          HML_PERMIT_REQUEST: ${{ inputs.request }}
          HML_PERMIT_SIGNING_KEY: ${{ secrets.HML_PERMIT_SIGNING_KEY }}
        run: python3 -I -B deploy/hml-sign-permits.py "$RUNNER_TEMP/funix-hml-permits"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: funix-hml-permits-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/funix-hml-permits/
          if-no-files-found: error
          retention-days: 1
