name: OS flow Chromium
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  os-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: python -m pip install playwright==1.56.0 pymupdf==1.26.7
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/work_order_flow.py
      - run: python tests/browser/os_v1_render.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funix-os-browser-evidence
          path: docs/evidencias/os-browser/
          if-no-files-found: ignore
