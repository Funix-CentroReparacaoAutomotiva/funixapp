name: Atendimento vehicle form Chromium
on:
  pull_request:
    branches: [main]
# Cancel only superseded PR checks. Never interrupt manual deployments or main pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: node scripts/atendimento-vehicle-browser.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atendimento-vehicle-chromium
          path: artifacts/vehicle-form/
          if-no-files-found: ignore
