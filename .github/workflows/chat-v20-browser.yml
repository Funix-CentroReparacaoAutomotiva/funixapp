name: Chat V20 conversation Chromium

on:
  pull_request:
    paths:
      - 'src/chat/**'
      - 'server/chat/**'
      - 'server/experimental/evolution-read/**'
      - 'tests/browser/chat_v20_conversations.py'
      - 'tests/browser/chat_v20_links.py'
      - '.github/workflows/chat-v20-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/chat_v20_conversations.py
        env:
          FUNIX_EVOLUTION_READ_ENABLED: 'false'
      - run: python tests/browser/chat_v20_links.py
        env:
          FUNIX_EVOLUTION_READ_ENABLED: 'false'
          FUNIX_CHAT_V20_LINKS_ENABLED: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-v20-synthetic-browser
          path: |
            docs/evidencias/issue71-chat-v20-browser/
            docs/evidencias/issue98-chat-v20-links-browser/
          if-no-files-found: ignore
