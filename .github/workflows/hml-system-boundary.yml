name: HML system boundary rehearsal

on:
  pull_request:
    paths:
      - '.github/workflows/hml-system-boundary.yml'
      - '.github/scripts/rehearse-system-boundary.sh'
      - '.github/scripts/probe-system-boundary.py'
      - '.github/scripts/rehearse-migration-gate.py'
      - 'deploy/remote-hml/migrate.py'
      - 'deploy/remote-hml/transport.py'

permissions:
  contents: read

jobs:
  system-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Exercise sudoers and systemd against synthetic HML state
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted bash .github/scripts/rehearse-system-boundary.sh
