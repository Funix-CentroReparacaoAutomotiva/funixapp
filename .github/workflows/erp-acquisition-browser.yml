name: ERP components Chromium
on:
  pull_request:
    paths:
      - 'src/erp/AcquisitionComponents.tsx'
      - 'server/erp/acquisition.ts'
      - 'shared/acquisition.ts'
      - 'tests/browser/erp_acquisition.py'
      - '.github/workflows/erp-acquisition-browser.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/erp_acquisition.py
        env:
          FUNIX_ERP_ACQUISITION_EVIDENCE: artifacts/acquisition
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: components-chromium
          path: artifacts/acquisition/
          if-no-files-found: ignore
