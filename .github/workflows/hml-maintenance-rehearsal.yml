name: HML isolated maintenance rehearsal

on:
  pull_request:
    paths:
      - 'deploy/hml-*.py'
      - 'deploy/tests/*hml*.py'
      - '.github/workflows/hml-maintenance-rehearsal.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python deployment regression tests
        run: python3 -m unittest discover -s deploy/tests -v
      - name: Pull synthetic test images
        run: |
          docker pull python:3.12-alpine
          docker pull nginx:alpine
      - name: Real Docker maintenance cycle on disposable runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted python3 deploy/tests/hml_docker_maintenance_cycle.py
