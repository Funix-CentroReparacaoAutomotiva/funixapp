name: Diagnosis component quotation Chromium
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: node scripts/diagnosis-quote-browser.mjs
      - run: node scripts/probe-manufacturer-search.mjs
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosis-quote-chromium
          path: artifacts/diagnosis-quote/
          if-no-files-found: ignore
